# ==============================================================================
# iMDB Admin — Proxy reverso (único ponto de entrada exposto do projeto)
#
# Fluxo do tráfego:
#   /api/*      -> backend (PHP/Apache); o prefixo /api é mantido na chamada
#                  e removido pela própria aplicação (Request::capturar)
#   /arquivos/* -> backend (capas dos filmes servidas como estáticos)
#   /*          -> frontend (SPA React; o fallback index.html é responsa do
#                  Nginx interno do próprio container frontend)
# ==============================================================================

worker_processes auto;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Compressão dos tipos mais comuns
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Serviços internos (nomes dos serviços do docker-compose)
    upstream backend_api {
        server backend:80;
    }

    upstream frontend_spa {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # ----- API REST (PHP) -----
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----- Arquivos estáticos do backend (capas) -----
        location /arquivos/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
        }

        # ----- SPA React -----
        location / {
            proxy_pass http://frontend_spa;
            proxy_set_header Host $host;
        }
    }
}
