# SPA servida pelo Nginx interno do container frontend.
# O Nginx externo (proxy reverso do projeto) é quem recebe o tráfego público.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback da single page application (rotas no cliente)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com cache
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }
}
